[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoharness"
version = "0.1.0"
description = "A lightweight Python harness engineering framework"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
litellm = ["litellm>=1.0"]
mcp = ["mcp>=1.0"]
all-providers = ["nanoharness[openai,anthropic,litellm,mcp]"]
dev = [
    "pytest>=7.0",
    "nanoharness[openai,mcp]",
]
research = [
    "langgraph==1.2.10",
]
agentdojo-research = [
    "agentdojo==0.1.35",
]

[tool.setuptools.packages.find]
include = ["nanoharness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "private_repo_data: reads protected repository-private artifacts and is excluded from canonical Full verification",
]
